name: Release

# Publica os pacotes npm (@swalay/poly-core, @swalay/poly-react) e o
# poly-server no PyPI quando uma release é publicada no GitHub, ou manualmente
# (Actions → Release → Run workflow). Versões já publicadas são puladas.
#
# Usa Trusted Publishing nos dois registros: nenhum token fica guardado; o npm
# e o PyPI confiam neste repositório e neste workflow.

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build-server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -e ".[dev]" build twine
      - run: pytest
      - run: python -m build
      - run: twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: poly-server-dist
          path: server/dist/

  publish-pypi:
    needs: build-server
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/poly-server/
    permissions:
      id-token: write # exigido pelo Trusted Publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: poly-server-dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # Releases que não mudam a versão do servidor não falham.
          skip-existing: true

  publish-npm:
    runs-on: ubuntu-latest
    environment:
      name: npm
      url: https://www.npmjs.com/org/swalay
    permissions:
      contents: read
      id-token: write # exigido pelo Trusted Publishing
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: https://registry.npmjs.org
      # Trusted Publishing exige npm 11.5.1 ou mais novo.
      - run: npm install -g npm@latest
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test
      - run: ./scripts/publish-npm.sh
